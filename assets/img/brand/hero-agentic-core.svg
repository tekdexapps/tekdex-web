<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 473 811" width="473" height="811" role="img" aria-label="An agentic AI core with orbiting agents feeding a central model">
<style>
  @keyframes spin      { to { transform: rotate(360deg); } }
  @keyframes spinBack  { to { transform: rotate(-360deg); } }
  @keyframes corePulse { 0%,100% { r: 46; } 50% { r: 52; } }
  @keyframes haloPulse { 0%,100% { r: 62; opacity: .38; } 50% { r: 88; opacity: .04; } }
  @keyframes dash      { to { stroke-dashoffset: -280; } }
  @keyframes rise      { 0%   { transform: translateY(0); opacity: 0; }
                         14%  { opacity: .9; }
                         86%  { opacity: .9; }
                         100% { transform: translateY(-330px); opacity: 0; } }
  @keyframes blink     { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes sweep     { 0%   { transform: translateY(-60px); opacity: 0; }
                         12%  { opacity: .5; }
                         88%  { opacity: .5; }
                         100% { transform: translateY(880px); opacity: 0; } }

  .ring-a { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
  .ring-b { transform-box: fill-box; transform-origin: center; animation: spinBack 36s linear infinite; }
  .agents { animation: spin 28s linear infinite; }
  .core   { animation: corePulse 3.4s ease-in-out infinite; }
  .halo   { animation: haloPulse 3.4s ease-in-out infinite; }
  .feed   { stroke-dasharray: 6 13; animation: dash 3.2s linear infinite; }
  .px     { animation: rise 10s linear infinite; }
  .node   { animation: blink 2.8s ease-in-out infinite; }
  .scan   { animation: sweep 8s linear infinite; }

  @media (prefers-reduced-motion: reduce) {
    .ring-a,.ring-b,.agents,.core,.halo,.feed,.px,.node,.scan { animation: none; }
    .px,.scan { opacity: .55; }
  }
</style>
<defs>
<radialGradient id="lift" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF3EA" stop-opacity="0.30"/><stop offset="0.55" stop-color="#FFF3EA" stop-opacity="0.08"/><stop offset="1" stop-color="#FFF3EA" stop-opacity="0"/></radialGradient>
<radialGradient id="coreFill" cx="0.34" cy="0.28" r="0.85"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#FFF3EA"/><stop offset="1" stop-color="#FFD9C0"/></radialGradient>
<linearGradient id="scanG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/></pattern>
</defs>
<rect width="473" height="811" fill="url(#grid)" opacity="0.55"/>
