<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160"
 role="img" aria-label="TekDex — AI engineered, talent delivered">
<defs>
  <path id="ring" d="M 80.0 18.0 a 62 62 0 1 1 -0.01 0"/>
  <style>
    .spin { transform-origin: 80.0px 80.0px; animation: td-spin 18s linear infinite; }
    @keyframes td-spin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none } }
  </style>
</defs>

<circle cx="80.0" cy="80.0" r="78.0" fill="#FFFFFF"/>
<circle cx="80.0" cy="80.0" r="78.0" fill="none" stroke="#F36B21" stroke-opacity=".22" stroke-width="1"/>

<g class="spin">
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.4" font-weight="700" letter-spacing="1.9" fill="#F36B21">
    <textPath href="#ring" startOffset="0">AI, ENGINEERED · TALENT, DELIVERED · </textPath>
  </text>
</g>

<!-- the TekDex pixel mark, held upright -->
<g fill="#F36B21">
  <rect x="70" y="66" width="7" height="7" rx="1.6"/>
  <rect x="81" y="66" width="7" height="7" rx="1.6" fill-opacity=".55"/>
  <rect x="70" y="77" width="7" height="7" rx="1.6" fill-opacity=".55"/>
  <rect x="81" y="77" width="7" height="7" rx="1.6"/>
  <rect x="59" y="77" width="7" height="7" rx="1.6" fill-opacity=".28"/>
  <rect x="81" y="88" width="7" height="7" rx="1.6" fill-opacity=".28"/>
</g>
</svg>