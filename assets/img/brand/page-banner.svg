<circle cx="250" cy="150" r="62" fill="none" stroke="#F36B21" stroke-opacity="0.34" stroke-width="1.4" stroke-dasharray="24 14"/>
<circle class="bnode" cx="250" cy="54" r="7" fill="#F36B21" style="animation-delay:0.00s"/>
