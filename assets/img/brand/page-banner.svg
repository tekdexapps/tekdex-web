<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 300" width="1920" height="300" preserveAspectRatio="xMidYMid slice" role="presentation">
<style>
  @keyframes bspin  { to { transform: rotate(360deg); } }
  @keyframes bback  { to { transform: rotate(-360deg); } }
  @keyframes bdash  { to { stroke-dashoffset: -240; } }
  @keyframes bdrift { 0%   { transform: translateX(0);     opacity: 0; }
                      15%  { opacity: .85; }
                      85%  { opacity: .85; }
                      100% { transform: translateX(240px); opacity: 0; } }
  @keyframes bpulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes bsweep { 0%   { transform: translateX(-260px); opacity: 0; }
                      12%  { opacity: .45; }
                      88%  { opacity: .45; }
                      100% { transform: translateX(2200px); opacity: 0; } }

  .br-a { animation: bspin 30s linear infinite; }
  .br-b { animation: bback 44s linear infinite; }
  .bfeed { stroke-dasharray: 5 12; animation: bdash 3.4s linear infinite; }
  .bpx  { animation: bdrift 11s linear infinite; }
  .bnode{ animation: bpulse 3s ease-in-out infinite; }
  .bscan{ animation: bsweep 9s linear infinite; }

  @media (prefers-reduced-motion: reduce) {
    .br-a,.br-b,.bfeed,.bpx,.bnode,.bscan { animation: none; }
    .bpx,.bscan { opacity: .5; }
  }
</style>
<defs><linearGradient id="bbg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#15181E"/><stop offset="0.5" stop-color="#0D1014"/><stop offset="1" stop-color="#15181E"/></linearGradient><radialGradient id="bglL" cx="0.14" cy="0.5" r="0.5"><stop offset="0" stop-color="#F36B21" stop-opacity="0.40"/><stop offset="1" stop-color="#F36B21" stop-opacity="0"/></radialGradient><radialGradient id="bglR" cx="0.88" cy="0.42" r="0.5"><stop offset="0" stop-color="#F58A4E" stop-opacity="0.30"/><stop offset="1" stop-color="#F58A4E" stop-opacity="0"/></radialGradient><radialGradient id="bmid" cx="0.5" cy="0.5" r="0.36"><stop offset="0" stop-color="#0A0C10" stop-opacity="0.80"/><stop offset="1" stop-color="#0A0C10" stop-opacity="0"/></radialGradient><linearGradient id="bscanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#F36B21" stop-opacity="0.9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><pattern id="bgrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern></defs>
<rect width="1920" height="300" fill="url(#bbg)"/>
<rect width="1920" height="300" fill="url(#bgrid)"/>
<rect width="1920" height="300" fill="url(#bglL)"/>
<rect width="1920" height="300" fill="url(#bglR)"/>
