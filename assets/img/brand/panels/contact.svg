akarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" fill-opacity="1" text-anchor="start" xml:space="preserve">Both ServiceNow leads</text><text x="446.2" y="356" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9AA2B1" fill-opacity="1" text-anchor="start" xml:space="preserve">available in 3 weeks</text><circle cx="248" cy="382" r="3.5" fill="#F36B21"/><text x="262" y="386" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" fill-opacity="1" text-anchor="start" xml:space="preserve">Agent engineer</text><text x="388.79999999999995" y="386" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9AA2B1" fill-opacity="1" text-anchor="start" xml:space="preserve">shipped 2 to production</text><path d="M244 414 h430" stroke="#262B35"/><text x="248" y="436" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5C6472" fill-opacity="1" text-anchor="start" xml:space="preserve">Rate card and start dates attached</text><text x="674" y="436" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#F36B21" fill-opacity="1" text-anchor="end" xml:space="preserve">no brochure</text><text x="30" y="490" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5C6472" fill-opacity="1" text-anchor="start" xml:space="preserve">You are typing</text><circle cx="128" cy="486" r="3.2" fill="#9AA2B1" fill-opacity="0.5"><animate attributeName="fill-opacity" values="0.2;0.9;0.2" dur="1.4s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="140" cy="486" r="3.2" fill="#9AA2B1" fill-opacity="0.5"><animate attributeName="fill-opacity" values="0.2;0.9;0.2" dur="1.4s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="152" cy="486" r="3.2" fill="#9AA2B1" fill-opacity="0.5"><animate attributeName="fill-opacity" values="0.2;0.9;0.2" dur="1.4s" begin="0.4s" repeatCount="indefinite"/></circle><rect x="28" y="506" width="664" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#262B35" stroke-width="1"/><text x="46" y="533" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#5C6472" fill-opacity="1" text-anchor="start" xml:space="preserve">Tell us what you are trying to build…</text><rect x="600" y="514" width="78" height="28" rx="8" fill="#F36B21" fill-opacity="1"/><text x="639" y="533" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="1" text-anchor="middle" xml:space="preserve">Send</text><style>@media (prefers-reduced-motion: reduce){animate{display:none}}</style></svg>